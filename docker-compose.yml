# Dev stack: pgvector Postgres, Redis, FastAPI (reload), RQ worker, Next.js dev.
# Works with zero configuration (dev-only credentials below); a root `.env`
# (copied from .env.example) overrides via ${VAR:-default} interpolation.
# Production overlay (docker-compose.prod.yml, Caddy, TLS) arrives with M9.

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-inspiration}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-inspiration}
      POSTGRES_DB: ${POSTGRES_DB:-inspiration}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-inspiration} -d ${POSTGRES_DB:-inspiration}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      ENV: ${ENV:-development}
      SECRET_KEY: ${SECRET_KEY:-dev-only-secret-change-me}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-inspiration}:${POSTGRES_PASSWORD:-inspiration}@postgres:5432/${POSTGRES_DB:-inspiration}
      REDIS_URL: redis://redis:6379/0
      DATA_DIR: /app/var/data
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-2048}
      MAX_ZIP_ENTRIES: ${MAX_ZIP_ENTRIES:-100000}
      MAX_ZIP_UNCOMPRESSED_MB: ${MAX_ZIP_UNCOMPRESSED_MB:-10240}
      MAX_ZIP_COMPRESSION_RATIO: ${MAX_ZIP_COMPRESSION_RATIO:-100}
      ENRICHMENT_REQUESTS_PER_MINUTE: ${ENRICHMENT_REQUESTS_PER_MINUTE:-20}
      ENRICHMENT_TIMEOUT_SECONDS: ${ENRICHMENT_TIMEOUT_SECONDS:-10}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_GENERATION_MODEL: ${ANTHROPIC_GENERATION_MODEL:-claude-sonnet-5}
      ANTHROPIC_FAST_MODEL: ${ANTHROPIC_FAST_MODEL:-claude-haiku-4-5}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_GENERATION_MODEL: ${OPENAI_GENERATION_MODEL:-gpt-5.2}
      OPENAI_FAST_MODEL: ${OPENAI_FAST_MODEL:-gpt-5-mini}
      AI_MONTHLY_BUDGET_USD: ${AI_MONTHLY_BUDGET_USD:-10}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-local}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-small-en-v1.5}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ./backend
    command: python -m app.workers.runner
    environment:
      ENV: ${ENV:-development}
      SECRET_KEY: ${SECRET_KEY:-dev-only-secret-change-me}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-inspiration}:${POSTGRES_PASSWORD:-inspiration}@postgres:5432/${POSTGRES_DB:-inspiration}
      REDIS_URL: redis://redis:6379/0
      DATA_DIR: /app/var/data
      ENRICHMENT_REQUESTS_PER_MINUTE: ${ENRICHMENT_REQUESTS_PER_MINUTE:-20}
      ENRICHMENT_TIMEOUT_SECONDS: ${ENRICHMENT_TIMEOUT_SECONDS:-10}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_GENERATION_MODEL: ${ANTHROPIC_GENERATION_MODEL:-claude-sonnet-5}
      ANTHROPIC_FAST_MODEL: ${ANTHROPIC_FAST_MODEL:-claude-haiku-4-5}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_GENERATION_MODEL: ${OPENAI_GENERATION_MODEL:-gpt-5.2}
      OPENAI_FAST_MODEL: ${OPENAI_FAST_MODEL:-gpt-5-mini}
      AI_MONTHLY_BUDGET_USD: ${AI_MONTHLY_BUDGET_USD:-10}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-local}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-small-en-v1.5}
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        # backend runs migrations on start
        condition: service_started

  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      backend:
        condition: service_started

volumes:
  pgdata:
