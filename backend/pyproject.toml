[project]
name = "inspiration-os-backend"
version = "0.1.0"
description = "InspirationOS backend — FastAPI, SQLAlchemy 2, RQ"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.30,<2.1",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "redis>=5.0",
    "rq>=2.0",
    "httpx>=0.27",
    "pgvector>=0.3",
    "fastembed>=0.5",
    "scikit-learn>=1.5",
    "numpy>=1.26",
    "anthropic>=0.40,<1",
    "openai>=1.40,<3",
    "argon2-cffi>=23.1",
]

[project.optional-dependencies]
# Host-only reel media extraction (`python -m app.cli transcribe-reels`).
# Not installed in the Docker images or CI; imported lazily by services/media/.
media = [
    "yt-dlp>=2025.1.1",
    "faster-whisper>=1.1",
    "Pillow>=10.4",
]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "pre-commit>=3.8",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app"]

[[tool.mypy.overrides]]
# No type stubs published for these libraries.
module = ["sklearn.*", "fastembed.*", "yt_dlp.*", "faster_whisper.*", "av.*", "PIL.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs real Postgres/Redis; skips with an explicit message when unreachable (CI always runs them)",
]
filterwarnings = ["error::DeprecationWarning:app.*"]
