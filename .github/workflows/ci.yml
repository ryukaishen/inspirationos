name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: inspiration
          POSTGRES_PASSWORD: inspiration
          POSTGRES_DB: inspiration
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U inspiration -d inspiration"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://inspiration:inspiration@localhost:5432/inspiration
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Guard — services reachable (integration tests must not skip in CI)
        run: |
          python - <<'EOF'
          import redis, sqlalchemy, os
          sqlalchemy.create_engine(os.environ["DATABASE_URL"]).connect().close()
          assert redis.Redis.from_url(os.environ["REDIS_URL"]).ping()
          EOF
      - name: Ruff format
        run: python -m ruff format --check .
      - name: Ruff lint
        run: python -m ruff check .
      - name: Mypy
        run: python -m mypy app
      - name: Pytest (unit + integration, coverage)
        run: python -m pytest -q -rs --cov=app --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Vitest
        run: npm run test -- --run

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure environment
        # Hermetic e2e: the deterministic mock embedding provider avoids the
        # one-time fastembed model download (the only network fetch the
        # analysis pipeline could make). AI_PROVIDER is already mock.
        run: |
          cp .env.example .env
          echo "EMBEDDING_PROVIDER=mock" >> .env
      - name: Start compose stack
        run: docker compose up -d --build
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Wait for stack (health through the frontend proxy)
        run: |
          timeout 180 bash -c 'until curl -fsS http://localhost:3000/api/health; do sleep 3; done'
      - name: Seed the e2e test user
        # Credentials must match e2e/auth-constants.ts; global-setup.ts logs
        # in with them and shares the session across every spec file.
        run: |
          docker compose exec -T backend python -m app.cli create-user \
            --email e2e@example.com --password e2e-test-password-not-a-secret
      - name: Playwright tests
        working-directory: e2e
        run: npx playwright test
      - name: Compose logs
        if: failure()
        run: docker compose logs --tail 200
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
